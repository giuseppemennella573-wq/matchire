# Fly.io: fly launch --copy-config --no-deploy && fly volumes create matchire_data --region sin --size 1 && fly deploy
# SQLite lives on the volume, so run exactly one machine.
app = "matchire"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "matchire_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/login"
  timeout = "5s"
