# Render Blueprint: New → Blueprint → pick this repo.
# A persistent disk keeps the SQLite database across deploys (needs a paid instance).
services:
  - type: web
    name: matchire
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /login
    disk:
      name: matchire-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_URL
        sync: false # e.g. https://matchire.onrender.com, or https://app.matchire.ai
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Email goes out through the Google Workspace mailbox (needs an app password).
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: giuseppe.mennella@matchire.ai
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Matchire <hello@matchire.ai>" # alias of the SMTP mailbox; must be enabled under Gmail "Send mail as"
      - key: EARLY_ACCESS_NOTIFY_EMAIL
        value: giuseppe.mennella@matchire.ai
      - key: ADMIN_EMAILS
        sync: false
